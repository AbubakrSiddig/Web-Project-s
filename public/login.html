<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — شركة بوكر فارما لتوزيع الأدوية</title>
    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #0a58ca;
            --pharmacy-green: #198754;
            --pharmacy-dark: #0f172a;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.12);
            overflow: hidden;
            width: 100%;
            max-width: 460px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            transition: all 0.3s ease;
        }
        .login-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
            padding: 35px 25px 25px;
            text-align: center;
            color: #ffffff;
            position: relative;
        }
        .login-header .brand-icon {
            width: 72px;
            height: 72px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }
        .login-header h3 {
            font-weight: 800;
            font-size: 1.5rem;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }
        .login-header p {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 0;
        }
        .login-body {
            padding: 35px 30px;
        }
        .form-floating label {
            color: #64748b;
        }
        .form-control {
            border-radius: 12px;
            border: 1.5px solid #cbd5e1;
            padding: 12px 16px;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
        }
        .btn-login {
            background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            font-size: 1.05rem;
            color: #ffffff;
            width: 100%;
            box-shadow: 0 6px 15px rgba(13, 110, 253, 0.25);
            transition: all 0.25s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(13, 110, 253, 0.35);
            background: linear-gradient(135deg, #0b5ed7 0%, #0a58ca 100%);
        }
        .demo-roles {
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px;
            margin-top: 25px;
            border: 1px dashed #cbd5e1;
        }
        .demo-roles .badge {
            cursor: pointer;
            padding: 6px 10px;
            font-size: 0.78rem;
            font-weight: 600;
            margin: 3px;
            transition: all 0.2s;
        }
        .demo-roles .badge:hover {
            transform: scale(1.05);
        }
        .password-toggle {
            cursor: pointer;
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="brand-icon">
            <i class="fa-solid fa-capsules"></i>
        </div>
        <h3>بوكر فارما</h3>
        <p>شركة بوكر فارما للتجارة والاستثمار المحدودة</p>
        <small class="text-white-50">نظام إدارة وتوزيع الأدوية والمستلزمات الطبية</small>
    </div>

    <div class="login-body">
        <form id="loginForm" autocomplete="off">
            <div class="mb-3">
                <label for="username" class="form-label fw-bold text-secondary">
                    <i class="fa-regular fa-user me-1 text-primary"></i> اسم المستخدم
                </label>
                <div class="input-group">
                    <input type="text" class="form-control" id="username" name="username" placeholder="مثال: admin" required autofocus>
                </div>
            </div>

            <div class="mb-4 position-relative">
                <label for="password" class="form-label fw-bold text-secondary">
                    <i class="fa-solid fa-lock me-1 text-primary"></i> كلمة المرور
                </label>
                <div class="position-relative">
                    <input type="password" class="form-control pe-3 ps-5" id="password" name="password" placeholder="أدخل كلمة المرور" required>
                    <span class="password-toggle" id="togglePasswordBtn">
                        <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
                    </span>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                    <label class="form-check-label text-muted small" for="rememberMe">
                        تذكر بيانات الدخول
                    </label>
                </div>
                <span class="badge bg-success-subtle text-success border border-success-subtle">
                    <i class="fa-solid fa-shield-halved me-1"></i> اتصال آمن BCRYPT
                </span>
            </div>

            <button type="submit" class="btn btn-login" id="submitBtn">
                <span id="btnText"><i class="fa-solid fa-right-to-bracket me-2"></i>تسجيل الدخول</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
            </button>
        </form>

        <!-- اختصارات سريعة للحسابات التجريبية -->
        <div class="demo-roles text-center">
            <div class="text-muted small fw-bold mb-2">
                <i class="fa-solid fa-bolt text-warning me-1"></i> حسابات سريعة للتجربة:
            </div>
            <div class="d-flex flex-wrap justify-content-center gap-1">
                <span class="badge bg-primary" role="button" onclick="setDemoCredentials('admin', 'Admin@123456')">
                    مدير النظام (Admin)
                </span>
                <span class="badge bg-dark" role="button" onclick="setDemoCredentials('manager', 'Manager@123')">
                    المدير العام (Manager)
                </span>
                <span class="badge bg-success" role="button" onclick="setDemoCredentials('sales', 'Sales@123')">
                    مسؤول مبيعات
                </span>
                <span class="badge bg-info text-dark" role="button" onclick="setDemoCredentials('store', 'Store@123')">
                    أمين المخزن
                </span>
                <span class="badge bg-warning text-dark" role="button" onclick="setDemoCredentials('purchase', 'Purchase@123')">
                    مسؤول المشتريات
                </span>
                <span class="badge bg-secondary" role="button" onclick="setDemoCredentials('account', 'Account@123')">
                    المحاسب المالي
                </span>
            </div>
        </div>
    </div>
</div>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- API Config & Auth Scripts (Cache Busted) -->
<script src="api-config.js?v=0.1.3"></script>
<script src="js/auth.js?v=0.1.3"></script>

<script>
    // التعبئة السريعة للحسابات
    function setDemoCredentials(username, password) {
        document.getElementById('username').value = username;
        document.getElementById('password').value = password;
        document.getElementById('password').focus();
    }

    // إظهار / إخفاء كلمة المرور
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('togglePasswordIcon');

    toggleBtn.addEventListener('click', function() {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.classList.remove('fa-eye');
            toggleIcon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            toggleIcon.classList.remove('fa-eye-slash');
            toggleIcon.classList.add('fa-eye');
        }
    });

    // معالجة نموذج تسجيل الدخول
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
            Swal.fire({
                icon: 'warning',
                title: 'تنبيه',
                text: 'يرجى إدخال اسم المستخدم وكلمة المرور.',
                confirmButtonText: 'حسناً',
                customClass: { confirmButton: 'btn btn-primary' }
            });
            return;
        }

        // إظهار حالة التحميل
        submitBtn.disabled = true;
        btnText.classList.add('d-none');
        btnSpinner.classList.remove('d-none');

        try {
            const data = await Auth.login(username, password);

            Swal.fire({
                icon: 'success',
                title: 'مرحباً بك!',
                html: `تم تسجيل الدخول بنجاح كـ <strong>${data.user.full_name}</strong><br><small class="text-muted">الدور: ${data.user.role_display_name}</small>`,
                timer: 1500,
                showConfirmButton: false
            }).then(() => {
                // الانتقال للوحة التحكم الرئيسية
                window.location.href = 'index.html';
            });

        } catch (error) {
            Swal.fire({
                icon: 'error',
                title: 'فشل تسجيل الدخول',
                text: error.message || 'اسم المستخدم أو كلمة المرور غير صحيحة.',
                confirmButtonText: 'حاول مجدداً',
                customClass: { confirmButton: 'btn btn-danger' }
            });
        } finally {
            submitBtn.disabled = false;
            btnText.classList.remove('d-none');
            btnSpinner.classList.add('d-none');
        }
    });
</script>

</body>
</html>
